onboarding = false
[theme]
name = "vesper"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/scripts/gh-prs.py status", interval_seconds = 120, timeout_seconds = 30 },
]

[keys]
focus_pane_left  = ["prefix+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# >>> herdr-usage managed block
# Generated by herdr-usage. Edit via the settings popup, or run
# `herdr plugin action invoke herdr-usage.setup-sidebar --undo` to remove.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "agent", "$uq_agent"],
  ["$uq_model"],
  [
    { token = "$uq_g5h_ok", fg = "#a6e3a1" },
    { token = "$uq_g5h_warn", fg = "#f9e2af" },
    { token = "$uq_g5h_crit", fg = "#f38ba8", bold = true },
    { token = "$uq_g5h_none", fg = "#6c7086", dim = true },
  ],
  [
    { token = "$uq_gwk_ok", fg = "#a6e3a1" },
    { token = "$uq_gwk_warn", fg = "#f9e2af" },
    { token = "$uq_gwk_crit", fg = "#f38ba8", bold = true },
    { token = "$uq_gwk_none", fg = "#6c7086", dim = true },
  ],
  ["$uq_burn"],
  [{ token = "$hb_build", fg = "#f9e2af" }],
  ["workspace", "tab"],
]

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-usage.settings"
description = "edit agent usage gauges"
# <<< herdr-usage managed block

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdbake.monitor"
description = "show running BitBake builds"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "~/.config/herdr/scripts/gh-prs.py list"
description = "GitHub PR watchlist"
width = "90%"
height = "85%"
